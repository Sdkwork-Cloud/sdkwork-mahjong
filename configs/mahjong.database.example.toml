# Games database config example (copy to host-local override, do not commit secrets)

[database]
engine = "postgresql"
host = "127.0.0.1"
port = 5432
database = "sdkwork_ai_dev"
schema = "sdkwork_ai_dev"
username = "sdkwork_ai_dev"
password_file = "database.secret"   # local placeholder; production uses /etc/sdkwork/database/database.secret
ssl_mode = "disable"
max_connections = 10
